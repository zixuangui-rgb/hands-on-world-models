<svg
  xmlns="http://www.w3.org/2000/svg"
  width="520"
  height="460"
  viewBox="0 0 520 460"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">H-JEPA 的多层预测关系</title>
  <desc id="description">
    JEPA-1 在低层表示中保留较多细节，用于较短时间尺度的预测；JEPA-2
    继续抽象低层表示，用于更长时间尺度的预测。
  </desc>
  <defs>
    <marker
      id="arrow-blue"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2" />
    </marker>
    <marker
      id="arrow-orange"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B56F00" />
    </marker>
    <marker
      id="arrow-gray"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="5"
        flood-color="#1D1D1F"
        flood-opacity="0.08"
      />
    </filter>
    <style>
      text {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
          "Microsoft YaHei", sans-serif;
        fill: #1d1d1f;
      }
      .section-title {
        font-size: 20px;
        font-weight: 700;
      }
      .node-label {
        font-size: 16px;
        font-weight: 650;
      }
      .note {
        font-size: 14px;
        fill: #5f6368;
      }
      .arrow-label {
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect
    x="6"
    y="6"
    width="508"
    height="448"
    rx="28"
    fill="#FFFFFF"
    stroke="#D9DEE3"
    stroke-width="1.5"
  />
  <text x="260" y="42" text-anchor="middle" font-size="22" font-weight="750">
    H-JEPA：不同层级预测不同时间尺度
  </text>

  <g filter="url(#shadow)">
    <rect
      x="28"
      y="68"
      width="464"
      height="150"
      rx="22"
      fill="#EAF5FB"
      stroke="#0072B2"
      stroke-width="2"
    />
  </g>
  <circle cx="58" cy="98" r="13" fill="#0072B2" />
  <text x="82" y="105" class="section-title">JEPA-2 · 高层状态</text>
  <text x="462" y="104" class="note" text-anchor="end">更抽象</text>

  <rect
    x="58"
    y="132"
    width="126"
    height="48"
    rx="24"
    fill="#FFFFFF"
    stroke="#0072B2"
    stroke-width="2"
  />
  <text x="121" y="162" class="node-label" text-anchor="middle">高层状态 t</text>
  <line
    x1="194"
    y1="156"
    x2="326"
    y2="156"
    stroke="#0072B2"
    stroke-width="3"
    marker-end="url(#arrow-blue)"
  />
  <text x="260" y="145" class="arrow-label" text-anchor="middle" fill="#005A8D">
    跨越较长时间
  </text>
  <rect
    x="336"
    y="132"
    width="126"
    height="48"
    rx="24"
    fill="#FFFFFF"
    stroke="#0072B2"
    stroke-width="2"
  />
  <text x="399" y="162" class="node-label" text-anchor="middle">高层状态 t+k</text>
  <text x="260" y="204" class="note" text-anchor="middle">
    舍弃更多短期细节，以较粗粒度预测更长时间尺度
  </text>

  <line
    x1="260"
    y1="270"
    x2="260"
    y2="226"
    stroke="#5F6368"
    stroke-width="2.5"
    marker-end="url(#arrow-gray)"
  />
  <rect
    x="280"
    y="229"
    width="92"
    height="28"
    rx="14"
    fill="#FFFFFF"
    stroke="#B7BCC2"
  />
  <text x="326" y="248" class="arrow-label" text-anchor="middle" fill="#45484C">
    继续抽象
  </text>

  <g filter="url(#shadow)">
    <rect
      x="28"
      y="270"
      width="464"
      height="162"
      rx="22"
      fill="#FFF5E5"
      stroke="#B56F00"
      stroke-width="2"
    />
  </g>
  <rect x="45" y="290" width="26" height="26" rx="6" fill="#E69F00" />
  <text x="82" y="312" class="section-title">JEPA-1 · 低层状态</text>
  <text x="462" y="311" class="note" text-anchor="end">更具体</text>

  <rect
    x="54"
    y="334"
    width="104"
    height="48"
    rx="10"
    fill="#FFFFFF"
    stroke="#B56F00"
    stroke-width="2"
  />
  <text x="106" y="364" class="node-label" text-anchor="middle">低层状态 t</text>
  <line
    x1="166"
    y1="358"
    x2="213"
    y2="358"
    stroke="#B56F00"
    stroke-width="3"
    marker-end="url(#arrow-orange)"
  />
  <rect
    x="222"
    y="334"
    width="104"
    height="48"
    rx="10"
    fill="#FFFFFF"
    stroke="#B56F00"
    stroke-width="2"
  />
  <text x="274" y="364" class="node-label" text-anchor="middle">低层状态 t+1</text>
  <line
    x1="334"
    y1="358"
    x2="381"
    y2="358"
    stroke="#B56F00"
    stroke-width="3"
    marker-end="url(#arrow-orange)"
  />
  <rect
    x="390"
    y="334"
    width="76"
    height="48"
    rx="10"
    fill="#FFFFFF"
    stroke="#B56F00"
    stroke-width="2"
  />
  <text x="428" y="364" class="node-label" text-anchor="middle">……</text>

  <text x="260" y="414" class="note" text-anchor="middle">
    保留更多局部细节，预测较短时间尺度上的变化
  </text>
</svg>
